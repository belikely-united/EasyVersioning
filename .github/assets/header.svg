<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="EasyVersioning. Keep your mind on the product, not on commits, pushes and branches.">
<style>
@font-face { font-family: 'Geist'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 100 900; }
text { font-family: 'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mark { animation: pop 0.7s cubic-bezier(0.22,1,0.36,1) both; transform-box: fill-box; transform-origin: center; }
.ring { stroke-dasharray: 1; animation: draw 0.8s cubic-bezier(0.65,0,0.35,1) both; }
.check { stroke-dasharray: 1; animation: draw 0.6s cubic-bezier(0.65,0,0.35,1) 0.45s both; }
.name { animation: rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
.l1 { animation: rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.35s both; }
.l2 { animation: rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.5s both; }
.strike { animation: strike 0.45s cubic-bezier(0.65,0,0.35,1) both; transform-box: fill-box; transform-origin: left center; }
.s0 { animation-delay: 1.1s; } .s1 { animation-delay: 1.35s; } .s2 { animation-delay: 1.6s; }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes strike { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="470" rx="28" fill="#faf8f4" stroke="#ece6dc" stroke-width="2"/>
<defs><mask id="cut" maskUnits="userSpaceOnUse" x="-110" y="-60" width="220" height="120"><rect x="-110" y="-60" width="220" height="120" fill="#fff"/><circle cx="-65" cy="0" r="13" fill="#000"/><circle cx="1" cy="-22.8" r="13" fill="#000"/><circle cx="46.5" cy="0" r="13" fill="#000"/></mask></defs><g transform="translate(600.0 108) scale(0.94)"><g class="mark"><rect class="ring" x="-96" y="-47" width="192" height="94" rx="47" fill="none" stroke="#1e7a52" stroke-width="8" pathLength="1"/><g mask="url(#cut)"><path class="check" d="M -65 0 L -55 0 C -45 0 -42 -22.8 -30 -22.8 L 15 -22.8 C 27 -22.8 34 -6 46.5 0 M -55 0 C -45 0 -42 21 -30 21 L 25 21 C 35 21 40 8 46.5 0 L 71 -22.8" fill="none" stroke="#1e7a52" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></g><circle cx="-65" cy="0" r="9" fill="#1e7a52"/><circle cx="1" cy="-22.8" r="9" fill="#1e7a52"/><circle cx="46.5" cy="0" r="9" fill="#1e7a52"/></g></g>
<text class="name" x="600.0" y="280" text-anchor="middle" font-size="108" font-weight="700" letter-spacing="-5" fill="#15171a">EasyVersioning</text>
<text class="l1" x="600.0" y="360" text-anchor="middle" font-size="42" font-weight="600" fill="#15171a">Keep your mind on the product,</text>
<g class="l2"><text y="414" font-size="42" font-weight="600" fill="#6e6a62"><tspan x="210.8" textLength="138.9" lengthAdjust="spacing">not&#160;on&#160;</tspan><tspan x="349.7" textLength="177.1" lengthAdjust="spacing">commits</tspan><tspan x="526.7" textLength="19.4" lengthAdjust="spacing">,&#160;</tspan><tspan x="546.1" textLength="147.7" lengthAdjust="spacing">pushes</tspan><tspan x="693.8" textLength="95.5" lengthAdjust="spacing">&#160;and&#160;</tspan><tspan x="789.3" textLength="190.5" lengthAdjust="spacing">branches</tspan><tspan x="979.8" textLength="9.4" lengthAdjust="spacing">.</tspan></text>
<rect class="strike s0" x="346.7" y="400.1" width="180.1" height="3.6" rx="2" fill="#ff2d55"/>
<rect class="strike s1" x="543.1" y="400.1" width="150.7" height="3.6" rx="2" fill="#ff2d55"/>
<rect class="strike s2" x="786.3" y="400.1" width="193.5" height="3.6" rx="2" fill="#ff2d55"/></g>
</svg>
